name: Deploy Application

on:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  Build-Android:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: ${{ runner.temp }}

      - name: Install NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-33 ndk;25.2.9519653"

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conan
        run: |
          pip install "conan==2.28.0"
          conan profile detect --force
          # УДАЛЯЕМ все удаленные репозитории Amnezia, чтобы conan работал только локально
          conan remote list | awk '{print $1}' | xargs -I {} conan remote remove {} || true

      - name: Compile Application
        shell: bash
        run: |
          chmod +x deploy/build.sh
          # Запускаем родной скрипт сборки без подписи ключами
          deploy/build.sh -t android --abi arm64-v8a
          
          mkdir -p output_apk
          find deploy/build -name "*.apk" -exec cp {} output_apk/ \;

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Amnezia-APK
          path: output_apk/
          retention-days: 7
