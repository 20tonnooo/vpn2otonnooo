name: Deploy Application

on:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  Build-Android:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

       - name: Install Android Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: ${{ runner.temp }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-33 ndk;25.2.9519653"

      - name: Inject Prebuilt Core and Assemble APK
        shell: bash
        run: |
          # Создаем структуру папок, которую ожидает увидеть Amnezia
          mkdir -p deploy/build/client/android-build
